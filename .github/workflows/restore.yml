name: Restore database from backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the backup is valid
        run: npm test
      - name: Build seed SQL from data/tools
        run: node scripts/seed-sql.mjs > "$RUNNER_TEMP/seed.sql"
      - name: Load every tool file into D1
        run: npx wrangler d1 execute open-earth-tools --remote --file "$RUNNER_TEMP/seed.sql"
