name: Nightly backup

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export tools from D1
        run: npx wrangler d1 execute open-earth-tools --remote --json --command "SELECT id, data FROM tools" > "$RUNNER_TEMP/rows.json"
      - name: Write tool files
        run: node scripts/export-json.mjs "$RUNNER_TEMP/rows.json"
      - name: Check the backup is valid
        run: npm test
      - name: Commit changes
        run: |
          git add data/tools
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): nightly backup from D1"
          git push
